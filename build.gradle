plugins {
    id 'java'
    id "io.freefair.lombok" version "8.13"
    id "run.halo.plugin.devtools" version "0.6.1"
}

group = 'com.timxs.storagetoolkit'

repositories {
    mavenCentral()
    // Halo snapshot 仓库
    maven { url = 'https://s01.oss.sonatype.org/content/repositories/snapshots/' }
    // JitPack 仓库 - 用于获取 avif-imageio
    maven { url = 'https://jitpack.io' }
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.23.0')
    compileOnly 'run.halo.app:api'

    // WebP 读写支持（Apache-2.0，含 Linux/macOS/Windows 多架构 native，含 aarch64）
    implementation 'com.github.usefulness:webp-imageio:0.10.2'
    // AVIF 读写支持（含 Windows/Linux arm64、Linux aarch64）
    implementation 'com.github.Tim0x0:avif-imageio:0.2.0'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
        vendor = JvmVendorSpec.AMAZON
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs.add("-parameters")
}

tasks.register('processUiResources', Copy) {
    from project(':ui').layout.buildDirectory.dir('dist')
    into layout.buildDirectory.dir('resources/main/console')
    dependsOn project(':ui').tasks.named('assemble')
    shouldRunAfter tasks.named('processResources')
}

tasks.named('classes') {
    dependsOn tasks.named('processUiResources')
}

halo {
    version = '2.23.0'
}

